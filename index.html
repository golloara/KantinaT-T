<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kantina — Order online</title>
<meta name="description" content="Kantina menu: breakfast, lunch and drinks. Build your order and send it on WhatsApp.">
<meta name="theme-color" content="#8E1B1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Lobster&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #8E1B1B;
    --maroon-dark: #6E1212;
    --red: #C8372D;
    --yellow: #F5C242;
    --yellow-soft: #FBE3A1;
    --cream: #FBF3E6;
    --card: #FFFBF4;
    --photo-bg: #F0F0F0;
    --line: #EADBC4;
    --ink: #3A1A12;
    --muted: #7A5A4C;
    --green: #1E8E3E;
    --green-dark: #17732F;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; overflow-x: clip; padding-bottom: 100px; }

  /* Decorative swooshes */
  .deco { position: absolute; top: 72px; width: 70px; height: 40px; z-index: 0; }
  .deco.l { left: -20px; background: var(--red); border-radius: 0 60px 60px 0; transform: rotate(-18deg); }
  .deco.r { right: -20px; background: var(--yellow); border-radius: 60px 0 0 60px; transform: rotate(18deg); }

  /* Header */
  header { position: relative; z-index: 1; padding: 14px 16px 4px; text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: center; height: 40px; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; position: relative; color: var(--maroon); }
  .icon-btn svg { width: 26px; height: 26px; }
  .badge {
    position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--maroon); color: #fff; font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .badge[hidden] { display: none; }
  .awning { width: 70px; height: 18px; margin: -34px auto 0; border-radius: 6px 6px 2px 2px;
    background: repeating-linear-gradient(90deg, var(--red) 0 8px, #fff 8px 16px); box-shadow: 0 1px 0 var(--line); }
  .brand { font-family: "Bree Serif", serif; color: var(--maroon); font-size: 34px; letter-spacing: 3px; margin: 2px 0 0; line-height: 1.1; }
  .est { font-size: 11px; letter-spacing: 3px; color: var(--maroon); font-weight: 800; margin: 0; }
  .tagline { font-family: "Lobster", cursive; color: var(--ink); font-size: 24px; line-height: 1.1; margin: 6px 0 0; font-weight: 400; }

  /* Category filter */
  .filters {
    position: sticky; top: 0; z-index: 4; background: var(--cream);
    padding: 10px 0 10px; margin-top: 6px;
    box-shadow: 0 6px 10px -10px rgba(80,30,10,.35);
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; scroll-snap-align: start; padding: 8px 14px; border-radius: 22px;
    background: var(--card); border: 1.5px solid var(--line); color: var(--maroon);
    font-weight: 800; font-size: 14px; white-space: nowrap; transition: background .2s, border-color .2s, color .2s;
  }
  .chip .n { font-weight: 700; opacity: .6; margin-left: 3px; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .chip[aria-pressed="true"] .n { opacity: .8; }

  /* Menu */
  #menu { transition: opacity .18s ease, transform .18s ease; }
  #menu.fading { opacity: 0; transform: translateY(8px); }
  .section { margin-top: 6px; }
  .section-title {
    font-family: "Bree Serif", serif; color: var(--maroon); font-size: 22px; font-weight: 400;
    margin: 14px 16px 10px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, var(--yellow), transparent); border-radius: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; position: relative; z-index: 1; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; text-align: left;
    box-shadow: 0 2px 6px rgba(80, 30, 10, .06);
    animation: rise .28s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card:active { transform: scale(.98); }
  .photo { width: 100%; aspect-ratio: 5 / 4; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .photo .emoji { font-size: 48px; }
  .card-body { padding: 8px 10px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; flex: 1; }
  .card h3 { font-family: "Bree Serif", serif; color: var(--maroon); font-size: 16.5px; margin: 0; font-weight: 400; line-height: 1.15; }
  .price { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .add {
    width: 30px; height: 30px; border-radius: 8px; background: var(--yellow); color: var(--maroon);
    font-size: 22px; font-weight: 700; line-height: 1; display: grid; place-items: center; flex: none;
  }
  .footer-note { font-family: "Lobster", cursive; color: var(--maroon); text-align: center; font-size: 22px; margin: 26px 0 0; }

  /* Sticky bottom bar */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--cream) 70%, rgba(251,243,230,0));
  }
  .bottom-bar .inner { max-width: 448px; margin: 0 auto; }
  .btn {
    width: 100%; padding: 14px 16px; border-radius: 12px; font-family: "Bree Serif", serif; font-size: 19px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary { background: var(--maroon); color: #fff; box-shadow: 0 4px 12px rgba(142,27,27,.3); }
  .btn-primary:active { background: var(--maroon-dark); }
  .btn-primary:disabled { background: #C9B3A6; box-shadow: none; cursor: default; }
  .btn-wa { background: var(--green); color: #fff; box-shadow: 0 4px 12px rgba(30,142,62,.3); }
  .btn-wa:active { background: var(--green-dark); }
  .btn-wa:disabled { background: #A8C7B0; box-shadow: none; }
  .btn-wa svg { width: 26px; height: 26px; }

  /* Overlay + sheet */
  .overlay { position: fixed; inset: 0; background: rgba(40, 15, 5, .45); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin: 0 auto; max-width: 480px;
    background: var(--cream); border-radius: 20px 20px 0 0; max-height: 90vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .25s ease-out;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-photo { width: 100%; height: 200px; background: var(--photo-bg); display: grid; place-items: center; }
  .sheet-photo img { width: 100%; height: 100%; object-fit: contain; }
  .sheet-photo .emoji { font-size: 80px; }
  .sheet-content { padding: 14px 16px 16px; }
  .sheet h2 { font-family: "Bree Serif", serif; color: var(--maroon); font-weight: 400; font-size: 26px; margin: 0; }
  .sheet .desc { color: var(--muted); margin: 4px 0 4px; font-size: 14.5px; line-height: 1.4; }
  .sheet .includes { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .close-x {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,.95); color: var(--maroon); font-size: 22px; display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  fieldset { border: 0; padding: 0; margin: 14px 0 0; }
  legend { font-weight: 800; font-size: 15px; margin-bottom: 6px; padding: 0; display: flex; gap: 8px; align-items: center; }
  legend small { font-weight: 700; color: var(--muted); font-size: 12px; background: var(--yellow-soft); padding: 1px 8px; border-radius: 10px; }
  .opt {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-bottom: 6px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px;
  }
  .opt:has(input:checked) { border-color: var(--maroon); background: #FFF6E6; }
  .opt input { accent-color: var(--maroon); width: 18px; height: 18px; margin: 0; flex: none; }
  .opt .delta { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .qty-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .stepper { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); }
  .stepper button { width: 42px; height: 46px; font-size: 22px; color: var(--maroon); font-weight: 700; }
  .stepper span { min-width: 26px; text-align: center; font-weight: 700; font-size: 17px; }
  .qty-row .btn { flex: 1; font-size: 17px; padding: 13px 10px; }

  /* Cart view */
  .cart-view {
    position: fixed; inset: 0; z-index: 8; background: var(--cream); overflow-y: auto;
    transform: translateX(100%); transition: transform .25s ease-out;
  }
  .cart-view.open { transform: translateX(0); }
  .cart-inner { max-width: 480px; margin: 0 auto; padding-bottom: 110px; position: relative; }
  .cart-head { display: flex; align-items: center; padding: 14px 8px 0; }
  .order-title { font-family: "Bree Serif", serif; color: var(--maroon); font-size: 32px; text-align: center; margin: 0 0 10px; font-weight: 400; }
  .order-title::before, .order-title::after { content: "\2726"; color: var(--yellow); font-size: 20px; margin: 0 10px; vertical-align: middle; }
  .mode { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .mode label {
    padding: 6px 16px; border-radius: 20px; background: var(--card); border: 1.5px solid var(--line);
    font-weight: 700; color: var(--maroon); font-size: 14px; position: relative;
  }
  .mode label:has(input:checked) { background: var(--yellow); border-color: var(--yellow); }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .line {
    display: flex; gap: 10px; align-items: center; margin: 0 12px 8px; padding: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .line .thumb { width: 64px; height: 56px; border-radius: 10px; flex: none; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; font-size: 28px; }
  .line .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .line .info { flex: 1; min-width: 0; }
  .line h4 { font-family: "Bree Serif", serif; color: var(--maroon); font-size: 16px; margin: 0; font-weight: 400; }
  .line .opts { font-size: 12.5px; color: var(--muted); margin: 1px 0 6px; }
  .line .mini { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
  .line .mini button { width: 28px; height: 28px; border-radius: 8px; background: var(--yellow-soft); color: var(--maroon); font-weight: 700; font-size: 17px; }
  .line .mini span { min-width: 24px; text-align: center; font-weight: 700; }
  .line .lp { font-weight: 700; color: var(--maroon); align-self: flex-start; padding-top: 2px; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 20px; }
  .field { margin: 12px 12px 0; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
    font: inherit; font-size: 16px; color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 16px 12px 0; padding-top: 12px; border-top: 1.5px solid var(--maroon);
    font-family: "Bree Serif", serif; color: var(--maroon); font-size: 24px;
  }
  .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 8px 16px 0; }

  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 20px); z-index: 20;
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="deco l"></div><div class="deco r"></div>
  <header>
    <div class="topbar">
      <span class="icon-btn" aria-hidden="true"></span>
      <button class="icon-btn" id="cartBtn" aria-label="View order">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
    </div>
    <div class="awning"></div>
    <h1 class="brand">KANTINA</h1>
    <p class="est">— EST. 2025 —</p>
    <p class="tagline">Good food, great moments!</p>
  </header>

  <nav class="filters" aria-label="Menu categories">
    <div class="chips" id="chips"></div>
  </nav>

  <main id="menu"></main>
  <p class="footer-note">¡Restaurante Entre Amigos!</p>

  <div class="bottom-bar">
    <div class="inner">
      <button class="btn btn-primary" id="viewOrder" disabled>Add something to start</button>
    </div>
  </div>
</div>

<!-- Item customisation sheet -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

<!-- Cart / order view -->
<section class="cart-view" id="cartView" aria-label="Your order">
  <div class="cart-inner">
    <div class="cart-head">
      <button class="icon-btn" id="backBtn" aria-label="Back to menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <h2 class="order-title">Your order</h2>
    <div class="mode" role="radiogroup" aria-label="Pickup or delivery">
      <label><input type="radio" name="mode" value="Pickup" checked> 📍 Pickup</label>
      <label><input type="radio" name="mode" value="Delivery"> 🛵 Delivery</label>
    </div>
    <div id="lines"></div>
    <div class="field">
      <label for="custName">Your name</label>
      <input id="custName" autocomplete="name" placeholder="So we know who it's for">
    </div>
    <div class="field" id="addrField" hidden>
      <label for="custAddr">Delivery address</label>
      <input id="custAddr" autocomplete="street-address" placeholder="Street, area, landmark">
    </div>
    <div class="field">
      <label for="custNote">Notes (optional)</label>
      <textarea id="custNote" placeholder="Pickup time, allergies…"></textarea>
    </div>
    <div class="total-row"><span>Total</span><span id="total">TT$0</span></div>
    <p class="hint">Opens WhatsApp with your order ready to send. We'll confirm it in the chat.</p>
  </div>
  <div class="bottom-bar">
    <div class="inner">
      <button class="btn btn-wa" id="waBtn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3c.2-.4.2-.9.2-1-.1-.1-.3-.2-.5-.3z"/></svg>
        Order on WhatsApp
      </button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURATION — edit these to set up the shop
   ===================================================================== */

// WhatsApp number that receives orders: country code + number, digits only.
// Trinidad & Tobago example: "18681234567". Leave "" to let the customer pick the chat (good for testing).
const WHATSAPP_NUMBER = "";

const CURRENCY = "TT$";

/* MENU — categories, each with its dishes.
   To add a dish, copy one block inside a category and change it.

   Dish fields:
     id       unique short name (no spaces)
     name     what the customer sees
     price    base price
     img      photo in the img/ folder  — or use  emoji: "🥤"  when there is no photo
     desc     short description (optional)
     includes list of things that come with it (optional)
     options  groups of choices (optional):
       type "one"  = pick exactly one (radio)      type "many" = pick any (checkboxes)
       each choice can have:
         price: 45   → this choice sets the dish price (e.g. sizes, fillings with their own price)
         add: 15     → extra cost on top
*/
const MENU = [
  {
    id: "breakfast", name: "Breakfast", icon: "☀️",
    items: [
      { id: "omelette", name: "Omelette", price: 50, img: "img/omelette.jpg",
        options: [{ title: "Type", type: "one", choices: [
          { label: "Vegetables", price: 50 },
          { label: "Ham & Cheese", price: 55 },
          { label: "Mushroom & Cheese", price: 50 } ]}] },
      { id: "bagels", name: "Bagels", price: 40, img: "img/bagels.jpg",
        options: [{ title: "Type", type: "one", choices: [
          { label: "Everything", price: 40 },
          { label: "Plain", price: 50 },
          { label: "Blueberry", price: 55 } ]}] },
      { id: "empanadas", name: "Empanadas", price: 30, img: "img/empanadas.jpg",
        options: [{ title: "Filling", type: "one", choices: [
          { label: "Fish", price: 30 },
          { label: "Cheese", price: 30 },
          { label: "Chicken", price: 30 },
          { label: "Shredded Beef", price: 30 },
          { label: "Pabellón", price: 45 },
          { label: "Cordon Bleu", price: 45 } ]}] },
      { id: "tequenos", name: "Tequeños", price: 35, img: "img/tequenos.jpg",
        options: [{ title: "Type", type: "one", choices: [
          { label: "Cheese", price: 35 },
          { label: "Plantain & Cheese", price: 40 } ]}] },
      { id: "arepas", name: "Arepas", price: 40, img: "img/arepas.jpg",
        options: [{ title: "Filling", type: "one", choices: [
          { label: "Fish", price: 40 },
          { label: "Chicken", price: 40 },
          { label: "Shredded Beef", price: 40 },
          { label: "Queso de Mano", price: 45 } ]}] },
      { id: "pastelitos", name: "Pastelitos", price: 12, img: "img/pastelitos.jpg",
        options: [{ title: "Filling", type: "one", choices: [
          { label: "Cheese" }, { label: "Ham & Cheese" }, { label: "Chicken" }, { label: "Beef" } ]}] },
      { id: "sandwich", name: "Sandwich", price: 30, img: "img/sandwich.jpg",
        desc: "Lettuce, tomato, ham and cheese.",
        options: [
          { title: "Sauce", type: "many", choices: [ { label: "Ketchup" }, { label: "Mayonnaise" } ]},
          { title: "Extras", type: "many", choices: [ { label: "Add chicken", add: 15 } ]} ] },
      { id: "pancakes", name: "Pancakes", price: 55, img: "img/pancakes.jpg",
        desc: "Serving: 4 pancakes with fruits or 2 eggs.",
        options: [
          { title: "Topping", type: "one", choices: [
            { label: "Strawberry" }, { label: "Blueberry" }, { label: "Kiwi" }, { label: "2 eggs" } ]},
          { title: "Syrup", type: "one", choices: [ { label: "Maple" }, { label: "Chocolate" } ]} ] }
    ]
  },
  {
    id: "special", name: "Lunch Special", icon: "⭐",
    items: [
      { id: "patacon", name: "Patacón", price: 45, img: "img/patacon.jpg",
        desc: "Lettuce, tomato, turkey ham and cheese.",
        options: [{ title: "Protein", type: "one", choices: [ { label: "Beef" }, { label: "Chicken" } ]}] },
      { id: "burger", name: "Burger and Fries", price: 65, img: "img/burger.jpg",
        desc: "Lettuce, tomato, eggs, turkey ham and cheese.",
        options: [{ title: "Protein", type: "one", choices: [ { label: "Beef" }, { label: "Chicken" } ]}] },
      { id: "bites", name: "Kantina Bites", price: 120, img: "img/bites.jpg",
        desc: "Our sharing platter:",
        includes: ["3 Mini Pastelitos", "3 Mini Empanadas", "3 Tequeños", "3 Mini Cachapas", "3 Mini Arepas"] },
      { id: "pasta", name: "Pasta Bolognese", price: 65, img: "img/pasta.jpg" },
      { id: "stirfried", name: "Stir-Fried Beef/Chicken", price: 65, img: "img/stirfried.jpg",
        desc: "With fresh salad.",
        options: [
          { title: "Protein", type: "one", choices: [ { label: "Beef" }, { label: "Chicken" } ]},

/* =====================================================================
   APP — no need to edit below
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const money = (n) => CURRENCY + (Number.isInteger(n) ? n : n.toFixed(2));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ITEMS = {};
MENU.forEach(cat => cat.items.forEach(i => { i.options = i.options || []; ITEMS[i.id] = i; }));

const photo = (item) => item.img
  ? `<img src="${item.img}" alt="${esc(item.name)}" loading="lazy">`
  : `<span class="emoji" aria-hidden="true">${item.emoji || "🍽️"}</span>`;

/* Price helpers */
function unitPrice(item, sel) {
  let base = item.price, extra = 0;
  for (const [g, c] of sel) {
    const ch = item.options[g].choices[c];
    if (ch.price != null) base = ch.price;
    extra += ch.add || 0;
  }
  return base + extra;
}
function priceRange(item) {
  const variants = item.options.flatMap(g => g.choices).filter(c => c.price != null).map(c => c.price);
  const all = variants.length ? variants : [item.price];
  return { min: Math.min(...all), from: new Set(all).size > 1 };
}
const chosen = (item, sel) => sel.map(([g, c]) => item.options[g].choices[c]);

/* Cart (kept in the browser so a refresh doesn't lose it) */
const STORE = "kantina-cart-v2";
let cart = [];
try {
  cart = JSON.parse(localStorage.getItem(STORE) || "[]").filter(l =>
    ITEMS[l.id] && l.sel.every(([g, c]) => ITEMS[l.id].options[g] && ITEMS[l.id].options[g].choices[c]));
} catch (e) { cart = []; }
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cart)); } catch (e) {} };
const cartCount = () => cart.reduce((s, l) => s + l.qty, 0);
const cartTotal = () => cart.reduce((s, l) => s + unitPrice(ITEMS[l.id], l.sel) * l.qty, 0);

function addToCart(id, sel, qty) {
  const key = id + "|" + sel.map(s => s.join(".")).join(",");
  const existing = cart.find(l => l.key === key);
  if (existing) existing.qty = Math.min(50, existing.qty + qty); else cart.push({ key, id, sel, qty });
  save(); updateBar();
  toast(`${qty} × ${ITEMS[id].name} added`);
}

/* ---------- Category filter ---------- */
let current = "all";
function renderChips() {
  const total = MENU.reduce((s, c) => s + c.items.length, 0);
  const chips = [{ id: "all", name: "All", icon: "", n: total }, ...MENU.map(c => ({ ...c, n: c.items.length }))];
  $("#chips").innerHTML = chips.map(c => `
    <button class="chip" data-cat="${c.id}" aria-pressed="${c.id === current}">
      ${c.icon ? c.icon + " " : ""}${esc(c.name)}<span class="n">${c.n}</span>
    </button>`).join("");
}
$("#chips").onclick = (e) => {
  const b = e.target.closest(".chip");
  if (!b || b.dataset.cat === current) return;
  current = b.dataset.cat;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.cat === current));
  b.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  const menu = $("#menu");
  menu.classList.add("fading");
  setTimeout(() => {
    renderMenu();
    // keep the filter bar in view, but don't jump if we're already near the top
    const top = $(".filters").offsetTop;
    if (window.scrollY > top) window.scrollTo({ top, behavior: "instant" });
    menu.classList.remove("fading");
  }, 180);
};

/* ---------- Menu ---------- */
function renderMenu() {
  const cats = current === "all" ? MENU : MENU.filter(c => c.id === current);
  let idx = 0;
  $("#menu").innerHTML = cats.map(cat => `
    <section class="section">
      <h2 class="section-title">${cat.icon} ${esc(cat.name)}</h2>
      <div class="grid">
        ${cat.items.map(i => {
          const r = priceRange(i);
          const delay = Math.min(idx++, 12) * 30;
          return `
          <button class="card" data-id="${i.id}" aria-label="Add ${esc(i.name)}" style="animation-delay:${delay}ms">
            <div class="photo">${photo(i)}</div>
            <div class="card-body">
              <div>
                <h3>${esc(i.name)}</h3>
                <div class="price">${r.from ? "From " : ""}${money(r.min)}</div>
              </div>
              <span class="add" aria-hidden="true">+</span>
            </div>
          </button>`;
        }).join("")}
      </div>
    </section>`).join("");
}
$("#menu").onclick = (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const item = ITEMS[card.dataset.id];
  // dishes with no choices and no description go straight to the order
  if (!item.options.length && !item.desc && !item.includes) addToCart(item.id, [], 1);
  else openSheet(item.id);
};

function updateBar() {
  const n = cartCount();
  $("#badge").hidden = n === 0;
  $("#badge").textContent = n;
  const b = $("#viewOrder");
  b.disabled = n === 0;
  b.textContent = n ? `View order (${n}) · ${money(cartTotal())}` : "Add something to start";
}

/* ---------- Customisation sheet ---------- */
let sheetQty = 1;
function openSheet(id) {
  const item = ITEMS[id];
  sheetQty = 1;
  $("#sheet").innerHTML = `
    <button class="close-x" id="closeSheet" aria-label="Close">×</button>
    <div class="sheet-photo">${photo(item)}</div>
    <div class="sheet-content">
      <h2 id="sheetTitle">${esc(item.name)}</h2>
      ${item.desc ? `<p class="desc">${esc(item.desc)}</p>` : ""}
      ${item.includes ? `<ul class="includes">${item.includes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <form id="optForm">
        ${item.options.map((g, gi) => `
          <fieldset>
            <legend>${esc(g.title)} <small>${g.type === "one" ? "Choose 1" : "Optional"}</small></legend>
            ${g.choices.map((c, ci) => `
              <label class="opt">
                <input type="${g.type === "one" ? "radio" : "checkbox"}" name="g${gi}" value="${ci}" ${g.type === "one" && ci === 0 ? "checked" : ""}>
                ${esc(c.label)}
                ${c.price != null ? `<span class="delta">${money(c.price)}</span>` : c.add ? `<span class="delta">+${money(c.add)}</span>` : ""}
              </label>`).join("")}
          </fieldset>`).join("")}
      </form>
      <div class="qty-row">
        <div class="stepper">
          <button type="button" id="qMinus" aria-label="Less">−</button>
          <span id="qVal">1</span>
          <button type="button" id="qPlus" aria-label="More">+</button>
        </div>
        <button class="btn btn-primary" id="addBtn"></button>
      </div>
    </div>`;
  const readSel = () => [...$("#optForm").querySelectorAll("input:checked")]
    .map(inp => [Number(inp.name.slice(1)), Number(inp.value)]);
  const refresh = () => {
    $("#qVal").textContent = sheetQty;
    $("#addBtn").textContent = `Add · ${money(unitPrice(item, readSel()) * sheetQty)}`;
  };
  $("#optForm").onchange = refresh;
  $("#qMinus").onclick = () => { sheetQty = Math.max(1, sheetQty - 1); refresh(); };
  $("#qPlus").onclick = () => { sheetQty = Math.min(20, sheetQty + 1); refresh(); };
  $("#closeSheet").onclick = closeSheet;
  $("#addBtn").onclick = () => { addToCart(id, readSel(), sheetQty); closeSheet(); };
  refresh();
  $("#overlay").classList.add("open");
  $("#sheet").classList.add("open");
  $("#sheet").scrollTop = 0;
}
function closeSheet() {
  $("#overlay").classList.remove("open");
  $("#sheet").classList.remove("open");
}
$("#overlay").onclick = closeSheet;

/* ---------- Cart ---------- */
function renderCart() {
  const lines = $("#lines");
  if (!cart.length) {
    lines.innerHTML = `<p class="empty">Your order is empty.<br>Go back and add something tasty!</p>`;
  } else {
    lines.innerHTML = cart.map((l, idx) => {
      const item = ITEMS[l.id];
      const opts = chosen(item, l.sel).map(c => esc(c.label) + (c.add ? ` +${money(c.add)}` : "")).join(" · ");
      return `
        <div class="line">
          <div class="thumb">${photo(item)}</div>
          <div class="info">
            <h4>${esc(item.name)}</h4>
            ${opts ? `<div class="opts">${opts}</div>` : ""}
            <div class="mini">
              <button data-act="dec" data-i="${idx}" aria-label="One less">${l.qty === 1 ? "🗑" : "−"}</button>
              <span>${l.qty}</span>
              <button data-act="inc" data-i="${idx}" aria-label="One more">+</button>
            </div>
          </div>
          <div class="lp">${money(unitPrice(item, l.sel) * l.qty)}</div>
        </div>`;
    }).join("");
  }
  $("#total").textContent = money(cartTotal());
  $("#waBtn").disabled = cart.length === 0;
}
$("#lines").onclick = (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const i = Number(b.dataset.i), l = cart[i];
  if (b.dataset.act === "inc") l.qty = Math.min(50, l.qty + 1);
  else if (--l.qty <= 0) cart.splice(i, 1);
  save(); renderCart(); updateBar();
};

function openCart() { renderCart(); $("#cartView").classList.add("open"); $("#cartView").scrollTop = 0; }
function closeCart() { $("#cartView").classList.remove("open"); }
$("#cartBtn").onclick = () => cartCount() ? openCart() : toast("Your order is empty");
$("#viewOrder").onclick = openCart;
$("#backBtn").onclick = closeCart;

document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = () => {
  $("#addrField").hidden = document.querySelector('input[name="mode"]:checked').value !== "Delivery";
});

/* ---------- WhatsApp message ---------- */
function buildMessage() {
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const name = $("#custName").value.trim();
  const addr = $("#custAddr").value.trim();
  const note = $("#custNote").value.trim();
  const out = ["Hi! I'd like to order:"];
  for (const l of cart) {
    const item = ITEMS[l.id];
    const opts = chosen(item, l.sel).map(c => c.label);
    out.push(`• ${l.qty} ${item.name}${opts.length ? " (" + opts.join(", ") + ")" : ""} — ${money(unitPrice(item, l.sel) * l.qty)}`);
  }
  out.push(`Total: ${money(cartTotal())}`);
  out.push(mode === "Pickup" ? "Pickup, please." : `Delivery, please.${addr ? " Address: " + addr : ""}`);
  if (name) out.push(`Name: ${name}`);
  if (note) out.push(`Notes: ${note}`);
  return out.join("\n");
}
$("#waBtn").onclick = () => {
  if (!cart.length) return;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildMessage())}`, "_blank");
};

/* ---------- Toast ---------- */
let tt;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600);
}

renderChips();
renderMenu();
updateBar();
</script>
